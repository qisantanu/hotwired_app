default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 2
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 3) %>
      polling_interval: 0.1
    - queues: [ background ]
      threads: 5
      polling_interval: 2
      processes: 3
    - queues: [ cleanup_queue ]
      threads: 1
      processes: 2
      polling_interval: 1
      processes: 3
    - queues: [ foo_queue ]
      threads: 5
      processes: 2
      polling_interval: 1
      processes: 3

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
